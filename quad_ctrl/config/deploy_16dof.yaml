# quad_ctrl 배포 config — 16-DOF (quad_real_16dof_sphere, 2026-10-06 허리 제거), MPC+WBIC.
#   사용: QC_CONFIG=config/deploy_16dof.yaml ./build/sim_bridge   (또는 실기 robot_main)
#   원칙③(파라미터=config). flat `key: value` → 시작 시 env로 주입(common/config.hpp).
#   ★precedence: 실제 env-var가 이미 있으면 그게 우선(실험 override), 없을 때만 이 값 적용.
#   ★게인/물리는 대부분 코드가 16·17dof(다리 4×4) 자동감지 → 여기선 "튜닝하려면 주석 해제"로 문서화(활성=코드기본과 동일값만).
#   ※배포 무관 연구 knob(COM_LEAD·DCM_K·SETTLE_*·RSL_* 등 TAMOLS-crawl)은 여기 없음 — 배포 파라미터만.

# ── 운용(operation) ──
GAIT:   trot        # trot | walk | run (프리셋)
TROT_V: 0.3         # 전진속도 명령 [m/s] (walk~0.3-0.6·trot~1.4·run~2.0)
BODY_H: 0.0         # 서기 높이 [m], 0=모델 기본(base_z0=0.5234). 범위 0.42~0.52

# ── WBIC/MPC 게인 (코드 16·17dof 자동감지 — 실기 재튜닝 시 주석 해제) ──
#   sim2real 재튜닝 1순위 = 지연/노이즈/접촉 바뀌면 SW_KP·W_ORI·W_AM·RAIBERT_K. [[sim2real-checklist-17dof]] B절.
# W_ORI:   200       # 자세 홀드 가중(축소지지 레벨링). 낮으면 첫 swing tilt 발산
# KD_AM:   24        # 각운동량 감쇠
# W_AM:    12        # 각운동량 보상(고속 공진밴드 제거 핵심)
# SW_KP:   2400      # swing 발끝 추종(고속 도달)
# KD_BASE: 25        # 속도 추종(전진 authority)
# STEP_H:  0.10      # swing 발 높이 [m] (walk0.05·trot0.10·run0.08)

# ── 액추에이터 물리 — ★PACE 실측 반영(2026-08-05, biped/emb/pace/RESULTS.md) ──
#   측정=HL/HR_hip(N=7)·모터단품(다리 미장착). ⚠낙관적 하한: 다리장착 시 마찰↑·I_link↑, 원위관절(calf/foot)은
#   기어단↑로 마찰↑. sim 검증: 이 값+지연8.4ms로 walk0.6/trot1.2/run2.0 falls=0·마찰2배 스트레스도 falls=0.
GEARBOX: 1          # 반사관성(로터관성·기어마찰·감쇠) ON. 발 flail 억제
ROTOR_I: 7.4e-4     # ★실측(placeholder 1e-4의 7.4배). 같은 모터→전관절 공통, armature=ROTOR_I·N²
JFRIC:   0.38       # ★실측 동적마찰(처프, 보행용). 저속정지=0.50~0.52(Stribeck). 다리장착/원위관절은 상향 필요
JDAMP:   0.099      # ★실측 점성감쇠(처프 0.099±0.003, HL n=2 채택). ⚠좌우차(HR 0.071) 반복부족 미검증→좌우차 주장 말 것
# MU:     0.6        # 접촉 마찰. 실노면 측정으로 교체
# MOTOR_CURVE: 1     # 토크-속도 곡선(선형근사). 데이터시트 들어오면 교체
# ★게인(측정): 저속 스윕 최적 kp=60/kd=3(모터단품 기준, 다리장착 후 재스윕). 왕복지연 T_rt=8.39±0.79ms(아래 참조).
#   ★강성→게인상한(PACE 실측): 관절강성 k=372~871 Nm/rad(hip, 위치의존 44%변동)·백래시 0.07~0.1°.
#     저수준 위치루프 Kp_max=k/9=41~97 (관성무관, 다리장착·10배관성에도 불변). 채택 kp=40~60이 이 안쪽.
#     ⚠발목모터(56/168, 더 큰 모터) 강성 미측정 → 실기 확보 시 측정 필요([[sim2real-checklist-17dof]]).

# ── 상태추정 KF (선형 접촉KF, IMU가속도 융합) ──
# KF_QV:     0.5     # 속도 프로세스노이즈(↑=가속도 신뢰↓·접촉측정 의존↑, 노이즈/지연 강건)
# KF_QP:     1e-4    # 위치 프로세스노이즈
# KF_RV:     1e-2    # 정지속도 측정노이즈
# KF_ACC_LP: 0.0     # 가속도 저역통과(0=off)

# ── sim2real 센서/버스 에뮬레이션 (sim 전용; ★실기 real_hal은 실제 노이즈/지연=여기 0 유지, 이중계산 방지) ──
#   ★지연 예산: 총 루프지연 <12ms면 falls=0(특성화). ★실측 왕복지연 T_rt=8.39±0.79ms(PACE, ACT+SENSE 합)<12ms → 여유.
#     sim 검증 시엔 SENSE+ACT=8.4로 두고 확인(walk/trot/run falls=0). 실배포 config는 0(실HW가 실제 지연 제공).
GYRO_N:       0.0   # 자이로 노이즈 [rad/s]  ⚠PACE 미측정(실기 IMU가 전부 0 유입)→근거값 없음·tilt E-stop 현재 무력
QUAT_N:       0.0   # 자세 노이즈 [rad]      ⚠IMU 미측정(상동)
ENCQ_N:       0.0   # 엔코더 위치 노이즈 [rad]   ★실측 σ=7.64e-5(=0.0044°, p-p 0.031°). 규약 어림 ~0.002보다 2배 깨끗
ENCDQ_N:      0.0   # 엔코더 속도 노이즈 [rad/s] ★실측 σ=0.0368(=2.11 deg/s). σ_dq/σ_q=482, 스칼라 NOISE로 동시 못맞춤→분리 주입
ACC_N:        0.0   # 가속도 노이즈          (~0.2, 미측정)
SENSE_LAT_MS: 0.0   # 센서→제어 지연 [ms]. 실측 T_rt 8.4ms(합)·sim검증용, 실배포=0(실HW)
ACT_LAT_MS:   0.0   # 제어→구동 지연 [ms]. 상동
